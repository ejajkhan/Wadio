[package]
name = "wadio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.27", default-features = false, features = [
    "wgpu",
    "android-game-activity",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.27"
jni = "0.21"
ndk = "0.8"
ndk-context = "0.1"
ndk-sys = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
sha2 = "0.10"
fs2 = "0.4"
lru = "0.12"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true