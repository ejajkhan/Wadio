[package]
name = "wadio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.27"
jni = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
argon2 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "dds", "exr", "ff", "hdr", "ico", "pnm", "qoi", "tga", "tiff", "avif"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
sha2 = "0.10"
fs2 = "0.4"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android-only eframe features must not be enabled during the host unit-test step.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["wgpu", "android-game-activity", "default_fonts"] }
ndk-context = "0.1"

# The unchanged GitHub Actions workflow runs `cargo test` on Ubuntu first.
# Give that host build supported Linux window-system backends instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Required by catch_unwind guards around image decoding and rotation.
# Do not change to "abort" without removing those guards and accepting process termination.
panic = "unwind"
